server:
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css,text/javascript,image/jpeg
    min-response-size: 2048
  port: 8081
  tomcat:
    threads:
      min-spare: 50                     # 最小空闲线程数
      max: 400                          # 最大工作线程数，根据服务器 CPU 核心数调整
    accept-count: 200                   # 等待队列长度
    max-connections: 10000              # 最大并发连接数
    max-http-form-post-size: 20MB       # Tomcat 层 POST 限制
    max-swallow-size: 100MB              # 出错时能吞下的最大数据量
    connection-timeout: 600000          # 连接超时（毫秒），大文件上传建议 10 分钟

spring:
  application:
    name: cordys-crm
  lifecycle:
    timeout-per-shutdown-phase: 60s
  cache:
    type: redis
  datasource:
    quartz:
      hikari:
        auto-commit: true
        connection-test-query: SELECT 1
        connection-timeout: 30000
        idle-timeout: 300000
        max-lifetime: 1800000
        maximum-pool-size: 50
        minimum-idle: 10
        pool-name: DatebookHikariCP
      password: ${spring.datasource.master.password}
      url: ${spring.datasource.master.url}
      username: ${spring.datasource.master.username}
    type: com.zaxxer.hikari.HikariDataSource
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    enabled: true
    encoding: UTF-8
    locations: classpath:migration
    table: cordys_crm_version
    validate-on-migrate: false
  freemarker:
    check-template-location: false
  groovy:
    template:
      check-template-location: false
  main:
    allow-circular-references: true
  messages:
    basename: i18n/cordys-crm
    encoding: UTF-8
  mvc:
    log-request-details: false
  servlet:
    multipart:
      enabled: true                   # 必须显式启用，否则配置失效
      max-file-size: 20MB             # 单个文件最大，根据业务调整
      max-request-size: 100MB          # 总请求大小（含多文件+表单）
      file-size-threshold: 2MB        # 超过此值写入磁盘，否则存内存
  session:
    redis:
      repository-type: indexed
    timeout: 43200s
  threads:
    virtual:
      enabled: true

mybatis:
  configuration:
    aggressive-lazy-loading: true
    auto-mapping-behavior: full
    cache-enabled: false
    default-statement-timeout: 25000
    lazy-loading-enabled: false
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    use-column-label: true

quartz:
  enabled: true
  properties:
    org:
      quartz:
        jobStore:
          acquireTriggersWithinLock: true
  scheduler-name: cordys-crm-quartz
  thread-count: 10

springdoc:
  api-docs:
    enabled: true
    groups:
      enabled: true
  swagger-ui:
    enabled: false

cordys:
  tenant:
    datasource:
      hikari:
        maximum-pool-size: 30
        minimum-idle: 2
        connection-timeout: 60000
        idle-timeout: 300000
        max-lifetime: 1800000
        connection-test-query: SELECT 1
  mmba:
    callback:
      stream-parallel-consumers: 5
      batch-flush-size: 16
      db-concurrency: 8
