<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 400" width="1860" height="400">
  <defs>
    <!-- 还原原图浅蓝渐变质感 -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cce5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#99ccff;stop-opacity:1" />
    </linearGradient>
    <!-- 浅色半透明装饰渐变 -->
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6f2ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#b3d9ff;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- 整体居中容器，适配1860宽度居中 -->
  <g transform="translate(230, 25)">
    <!-- 左侧主图形部分 -->
    <!-- 左上 平行四边形 -->
    <polygon points="40,40 170,40 140,170 10,170" fill="url(#logoGradient)" />
    <!-- 右上 平行四边形 -->
    <polygon points="195,70 265,70 250,140 180,140" fill="url(#logoGradient)" />
    <!-- 左下 平行四边形 -->
    <polygon points="70,195 140,195 125,265 55,265" fill="url(#logoGradient)" />
    <!-- 右下 平行四边形 -->
    <polygon points="175,175 305,175 275,305 145,305" fill="url(#logoGradient)" />

    <!-- 新增点缀装饰图形 -->
    <!--circle cx="280" cy="60" r="8" fill="url(#lightGrad)"/ -->
    <!--circle cx="35" cy="280" r="6" fill="url(#lightGrad)"/ -->
    <!--polygon points="300,290 315,275 330,290 315,305" fill="url(#lightGrad)"/ -->
    <!--line x1="20" y1="20" x2="80" y2="20" stroke="#99ccff" stroke-width="2"/ -->
    <!--line x1="285" y1="310" x2="320" y2="310" stroke="#99ccff" stroke-width="2"/ -->

    <!-- 右侧主文字 加大图文间距+文字字间距 -->
    <text x="380" y="250" 
          font-family="Arial, 'Microsoft YaHei', sans-serif" 
          font-size="220" fill="#003366" font-weight="bold"
          letter-spacing="12px">
      信链+
    </text>

    <!-- 新增辅助副标题文字 -->
    <!--text x="385" y="330" 
          font-family="Arial, 'Microsoft YaHei', sans-serif" 
          font-size="36" fill="#336699"
          letter-spacing="6px">
      数字互联 · 可信链接
    </text -->
    <!-- 新增英文小字 -->
    <text x="385" y="360" 
          font-family="Arial, sans-serif" 
          font-size="50" fill="#6699cc"
          letter-spacing="4px">
      XINLIAN DIGITAL LINK
    </text>
  </g>
</svg>